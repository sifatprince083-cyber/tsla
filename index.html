  const id = ids[Math.floor(Math.random() * ids.length)], M = MISSIONS[id], tier = Math.min(PROG.tiers[id] || 0, M.n.length - 1);
  return { id, goal: M.n[tier] * (1 + Math.max(0, (PROG.tiers[id] || 0) - tier)), have: 0 };
}
PROG.act = PROG.act.filter(m => MISSIONS[m.id]);
while (PROG.act.length < 3) PROG.act.push(newMission(PROG.act.map(m => m.id)));
const mText = m => { const M = MISSIONS[m.id]; return M.ico + ' ' + (LANG === 'en' ? M.en : M.bn).replace('{0}', num(m.goal)); };

function findTarget(big) {
  const rm = curFxObj().ReachMult || 1;
  const rs = (big ? 9 : 6.2) * rm, rd = (big ? 7.5 : 5.2) * rm;
  let best = null, bs = -1e9;
  for (const v of veh) {
    if (v.kind !== 'tesla' || v.slapped || v.d > 5.4) continue;
    const ds = v.s - P.s, dd = v.d - P.d;
    if (Math.abs(ds) > rs || Math.abs(dd) > rd || Math.abs(dd) < 0.45) continue;
    if (big && v.type === 'good') continue;
    const prio = v.type === 'boss' ? 4 : v.type === 'wrong' ? 3 : v.type === 'chor' ? 2.5 : v.violated || (v.type === 'uturn' && v.phase >= 1) ? 2 : v.type === 'good' ? -6 : 1;
    const sc = prio * 10 - Math.abs(ds) - Math.abs(dd) * 0.5;
    if (sc > bs) { bs = sc; best = v; }
  }
  return best;
}

    if (wa) wa.href = 'https://wa.me/?text=' + encodeURIComponent(shareText);
    if (fba) fba.href = 'https://www.facebook.com/sharer/sharer.php?u=' + encodeURIComponent(url) + '"e=' + encodeURIComponent(t('refMsg'));

    const fb = window.TTFirebase, signedIn = !!(fb && fb.isReady() && fb.currentUser());
    const authBox = $('refAuthBox');
    if (authBox) {
      if (fb && fb.isReady() && !signedIn) {
        authBox.innerHTML = `<div class="lbnote" style="margin-bottom:.4em">${esc(t('refSign'))}</div><button class="btn" id="refSignBtn" style="font-size:.95em;padding:.4em 1.1em">🔑 ${esc(t('lbGoSign'))}</button>`;
        const sb = $('refSignBtn');
        if (sb) sb.onclick = () => { fb.signIn().catch(() => {}); };
      } else {
        authBox.innerHTML = '';
      }
    }

    const refs = (fb && fb.isReady() && typeof fb.referrals === 'function') ? fb.referrals() : [];
    const totalEl = $('refTotal');
    if (totalEl) totalEl.textContent = num(refs.length);
    const listEl = $('refList');
    if (listEl) {
      if (!signedIn) {
        listEl.innerHTML = '';
      } else if (!refs.length) {
        listEl.innerHTML = `<div class="lbnote">${esc(t('refEmpty'))}</div>`;
      } else {
        listEl.innerHTML = refs.map((r, i) => `<div class="lbrow"><i>${num(i + 1)}</i><b>${esc(r.referredName || 'Player')}<em>#${esc(num(r.referredNumber || 0))} · ${esc(t('refJoined'))}</em></b><span>🎁</span></div>`).join('');
      }
    }
  };

  $('refCopyBtn').onclick = () => {
    copyText(getShareUrl()).then(ok => {
      if (ok) {
        $('refCopyBtn').textContent = t('refCopied');
        setTimeout(() => { if ($('refCopyBtn')) $('refCopyBtn').textContent = t('refCopy'); }, 2200);
      }
    });
  };
  $('refNativeShare').onclick = () => {
    const url = getShareUrl();
    if (navigator.share) {
      navigator.share({ title: 'BD Tesla Slapper', text: t('refMsg'), url }).catch(() => {});
    } else {
      copyText(t('refMsg') + ' ' + url).then(ok => {
        if (ok) {
          $('refNativeShare').textContent = t('refCopied');
          setTimeout(() => { if ($('refNativeShare')) $('refNativeShare').textContent = t('refShare'); }, 2200);
        }
      });
    }
  };
  el._redraw = draw;
  draw();
}

function getChallengeUrl(score) {
  let u = getShareUrl();
  try {
    const url = new URL(u);
    url.searchParams.set('ch', String(Math.max(50, Math.round(score || 0))));
    const fb = window.TTFirebase, prof = fb && fb.isReady() ? fb.playerProfile() : null;
    let nmMe = (prof && prof.displayName) || '';
    if (!nmMe) try { nmMe = localStorage.getItem('tt_name') || ''; } catch (e) {}
    if (nmMe) url.searchParams.set('chn', nmMe.slice(0, 24));
    u = url.toString();
  } catch (e) {}
  return u;
}
function shopShow() {
  let el = $('shopView'); if (el) el.remove();
  el = document.createElement('div'); el.id = 'shopView';
  el.innerHTML = `<div class="card glass"><button class="btn2 shut" id="shopClose" aria-label="Close">✕</button><h3>${t('shopT')}</h3>
    <div class="refstat"><span>🪙 ${t('shopWallet')}</span><b id="shopBal">${num(walletBal())}</b></div>
    <div id="shopBody" class="shop-grid"></div></div>`;
  document.body.appendChild(el);
  el.addEventListener('click', e => { if (e.target === el) el.remove(); });
  $('shopClose').onclick = () => el.remove();
  let busy = false;
  const draw = () => {
    const bal = walletBal();
    if ($('shopBal')) $('shopBal').textContent = num(bal);
    const en = LANG === 'en';
    const bikeRows = BIKES.filter(b => b.shopCost).map(b => {
      const own = SHOP.bikes.includes(b.id), eq = PROG.bike === b.id;
      const cls = eq ? 'eq' : own ? 'owned' : '';
      const lbl = eq ? t('shopEquipped') : own ? t('shopEquip') : t('shopBuy', num(b.shopCost));
      const dis = (!own && bal < b.shopCost) ? 'disabled' : '';
      return `<div class="shop-item${eq ? ' eq' : ''}"><div class="shop-ico">🏍️</div><div class="shop-info"><b>${esc(nm(b))}</b><small>${esc(en ? b.descEn : b.descBn)}</small></div><button class="shop-act ${cls}" data-kind="bike" data-id="${b.id}" ${dis}>${lbl}</button></div>`;
    }).join('');
    const fxRows = SLAP_FX.map(f => {
      const own = SHOP.fx.includes(f.id), eq = SHOP.curFx === f.id;
      const cls = eq ? 'eq' : own ? 'owned' : '';
      const lbl = eq ? t('shopEquipped') : own ? t('shopEquip') : t('shopBuy', num(f.cost));
      const dis = (!own && bal < f.cost) ? 'disabled' : '';
      return `<div class="shop-item${eq ? ' eq' : ''}"><div class="shop-ico">${f.ico}</div><div class="shop-info"><b>${esc(nm(f))}</b><small>${esc(en ? f.descEn : f.descBn)}</small></div><button class="shop-act ${cls}" data-kind="fx" data-id="${f.id}" ${dis}>${lbl}</button></div>`;
    }).join('');
    const boRows = SHOP_BOOSTERS.map(bo => {
      const cnt = SHOP.boost[bo.id] || 0;
      const dis = bal < bo.cost ? 'disabled' : '';
      return `<div class="shop-item"><div class="shop-ico">${bo.ico}</div><div class="shop-info"><b>${esc(nm(bo))}</b><small>${esc(en ? bo.descEn : bo.descBn)} · ${esc(t('shopHave', num(cnt)))}</small></div><button class="shop-act" data-kind="boost" data-id="${bo.id}" ${dis}>${t('shopBuy', num(bo.cost))}</button></div>`;
    }).join('');
    $('shopBody').innerHTML = `<div class="lbl">${t('shopBikes')}</div>${bikeRows}<div class="lbl" style="margin-top:.35em">${t('shopFx')}</div>${fxRows}<div class="lbl" style="margin-top:.35em">${t('shopBoost')}</div>${boRows}`;
  };
  $('shopBody').onclick = e => {
    const btn = e.target.closest('button[data-kind]'); if (!btn || busy) return;
    const { kind, id } = btn.dataset;
    if (kind === 'bike') {
      const b = BIKES.find(x => x.id === id); if (!b) return;
      if (SHOP.bikes.includes(id)) {
        PROG.bike = id; saveProg(); SFX.pickup(); renderChips(); if (state === 'menu') toMenu(); draw(); return;
      }
      if (walletBal() < b.shopCost) { toast(t('shopNoCoin')); SFX.bad(); return; }
      busy = true;
      spendCoins(b.shopCost).then(res => {
        busy = false;
        if (!res || !res.ok) { toast(t('shopNoCoin')); SFX.bad(); return; }
        if (!SHOP.bikes.includes(id)) SHOP.bikes.push(id);
        SHOP.curFx = SHOP.curFx || 'normal';
        saveShop(); PROG.bike = id; saveProg();
        SFX.levelup(); toast(t('shopBought', nm(b)));
        renderChips(); if (state === 'menu') toMenu(); draw();
      }).catch(() => { busy = false; });
    } else if (kind === 'fx') {
      const f = SLAP_FX.find(x => x.id === id); if (!f) return;
      if (SHOP.fx.includes(id)) {
        SHOP.curFx = id; saveShop(); SFX.pickup(); draw(); return;
      }
      if (walletBal() < f.cost) { toast(t('shopNoCoin')); SFX.bad(); return; }
      busy = true;
      spendCoins(f.cost).then(res => {
        busy = false;
        if (!res || !res.ok) { toast(t('shopNoCoin')); SFX.bad(); return; }
        if (!SHOP.fx.includes(id)) SHOP.fx.push(id);
        SHOP.curFx = id; saveShop();
        SFX.levelup(); toast(t('shopBought', nm(f)));
        renderChips(); draw();
      }).catch(() => { busy = false; });
    } else if (kind === 'boost') {
      const bo = SHOP_BOOSTERS.find(x => x.id === id); if (!bo) return;
      if (walletBal() < bo.cost) { toast(t('shopNoCoin')); SFX.bad(); return; }
      busy = true;
      spendCoins(bo.cost).then(res => {
        busy = false;
        if (!res || !res.ok) { toast(t('shopNoCoin')); SFX.bad(); return; }
        SHOP.boost[id] = (SHOP.boost[id] || 0) + 1; saveShop();
        SFX.pickup(); toast(t('shopBought', nm(bo)));
        renderChips(); draw();
      }).catch(() => { busy = false; });
    }
  };
  el._redraw = draw;
  draw();
}
function dailyShow() {
  let el = $('dailyView'); if (el) el.remove();
  el = document.createElement('div'); el.id = 'dailyView';
  el.innerHTML = `<div class="card glass"><button class="btn2 shut" id="dailyClose" aria-label="Close">✕</button><h3>${t('dailyT')}</h3>
    <div class="lbsub"><span>${t('dailySub')}</span></div>
    <div class="daily-grid" id="dailyGrid"></div>
    <button class="btn" id="dailyClaimBtn" style="width:100%;font-size:1.15em"></button></div>`;
  document.body.appendChild(el);
  el.addEventListener('click', e => { if (e.target === el) el.remove(); });
  $('dailyClose').onclick = () => el.remove();
  const draw = () => {
    const ready = dailyReady(), idx = ready ? (DAILY.streak % 7) : ((DAILY.streak + 6) % 7);
    $('dailyGrid').innerHTML = DAILY_REWARDS.map((r, i) => {
      const done = i < DAILY.streak && (!ready || i < idx);
      const cur = ready && i === idx;
      return `<div class="dcard${r.day === 7 ? ' d7' : ''}${done ? ' done' : ''}${cur ? ' cur' : ''}"><span>${t('dailyDay', num(r.day))}</span><em>${r.ico}</em><b>${esc(nm(r))}</b></div>`;
    }).join('');
    const btn = $('dailyClaimBtn');
    btn.disabled = !ready;
    btn.textContent = ready ? t('dailyClaim') : t('dailyClaimed');
  };
  $('dailyClaimBtn').onclick = () => {
    const rw = claimDailyReward();
    if (!rw) return;
    SFX.levelup();
    toast(t('dailyGot', nm(rw)));
    renderChips();
    draw();
    setTimeout(() => { renderChips(); if ($('shopView') && $('shopView')._redraw) $('shopView')._redraw(); }, 600);
  };
  el._redraw = draw;
  draw();
}

addEventListener('tt-synced', e => { if (e.detail && e.detail.ok) { LB.top = e.detail; LB.at = Date.now(); lbKing(); } });   // offline scores just reached the server
addEventListener('tt-firebase-update', () => {
  const fb = window.TTFirebase;
  if (!fb || !fb.isReady()) return;
  const u = fb.currentUser();
  if (u && u.uid) LB.me = u.uid;
  const d = fb.leaderboard();
  if (d && d.ok) {
    LB.top = d;
    LB.at = Date.now();
    try { localStorage.setItem('tt_top', JSON.stringify(d)); } catch (e) {}
    lbKing();
    const lv = $('lbView');
    if (lv && typeof lv._redraw === 'function') lv._redraw();
  }
  const rv = $('refView');
  if (rv && typeof rv._redraw === 'function') rv._redraw();
  const sv = $('shopView');
  if (sv && typeof sv._redraw === 'function') sv._redraw();
  const dv = $('dailyView');
  if (dv && typeof dv._redraw === 'function') dv._redraw();
  renderChips();
});
$('lbBtn').addEventListener('click', () => { initAudio(); lbShow('week'); });
$('refBtn').addEventListener('click', () => { initAudio(); refShow(); });
if ($('shopBtn')) $('shopBtn').addEventListener('click', () => { initAudio(); shopShow(); });
if ($('dailyBtn')) $('dailyBtn').addEventListener('click', () => { initAudio(); dailyShow(); });
if ($('challengeBtn')) $('challengeBtn').addEventListener('click', () => {
  initAudio();
  const url = getChallengeUrl(G.score), msg = t('chCopyMsg', num(G.score));

});
$('lbTag').addEventListener('click', () => lbShow(G.lbRank ? 'week' : 'all'));
lbLoad(true);
{ let tries = 0; const w8 = setInterval(() => { if (++tries > 200) clearInterval(w8); else if (state === 'menu' && LB.top) { clearInterval(w8); askFirstName(); } }, 600); }
$('sheetClose').addEventListener('click', () => $('sheet').classList.add('hidden'));
$('bikeChips').addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b || b.disabled) return;
  const obj = BIKES.find(x => x.id === b.dataset.b);

  applyLang();
});
$('shareBtn').addEventListener('click', () => { try { showShare(); return; } catch (e) {}
  const msg = t('shareMsg', G.slaps, G.score, G.plates), url = getShareUrl();
  if (navigator.share) navigator.share({ title: 'BD Tesla Slapper', text: msg, url }).catch(() => {});
  else copyText(msg + ' ' + url).then(ok => { if (ok) $('shareBtn').textContent = t('copied'); });
});
document.addEventListener('visibilitychange', () => {
  if (document.hidden) { if (state === 'play') setState('pause'); }
  else wakeAudio();
});
for (const ev of ['pointerdown', 'touchend', 'keydown']) addEventListener(ev, () => { if (AU.ctx) wakeAudio(); }, true);
addEventListener('pageshow', wakeAudio);

window.TTBridge = { state: () => state, lang: () => LANG, score: () => (G && G.score) || 0 };
// ================= go =================
for (let i = 0; i < 18; i++) makeTesla();
for (let i = 0; i < BUSES.length; i++) pooled('bus' + i, 1, () => buildBus(BUSES[i]));
for (let i = 0; i < 8; i++) makeCar();
for (const k of ['police', 'hawker', 'walker']) for (let i = 0; i < 4; i++) makeRunner(k);
makeManhole(); for (const k of new Set(CART_KINDS)) makeCartMesh(k); pooled('train', 1, makeTrainCar);
// compile every shader up front so the first slap, pickup or bus doesn't stutter
{
  const warm = new THREE.Group();
  for (const p of Object.values(POOLS)) warm.add(p[0]);
  for (const mat of [MAT.plate, MAT.puddle, MAT.glow, MAT.aura, MAT.bullet, MAT.stink, MAT.sigR, MAT.sigY, MAT.sigG, MAT.indOn, MAT.water, MAT.uturn, MAT.check, ...FACE_MATS]) warm.add(mat.isSpriteMaterial ? new THREE.Sprite(mat) : new THREE.Mesh(GEO.box, mat));
  scene.add(warm); resetGame(); renderer.compile(scene, camera);
  // compile() builds shaders but doesn't upload textures; a first-use upload was the 20 ms spike at the first raid
  warm.traverse(o => { const m = o.material; if (m) for (const mm of [].concat(m)) if (mm.map) renderer.initTexture(mm.map); });
  scene.remove(warm);
  for (const p of Object.values(POOLS)) warm.remove(p[0]);
}
applyLang();
resetGame();
$('loading').remove();
window.__ttReady = true;
setState('menu');
requestAnimationFrame(frame);
